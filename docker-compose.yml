version: '3.8'

services:
  db:
    image: mariadb:10.6.4
    container_name: wp_custom_theme_db
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - wp_custom_theme_db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=somewordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wp_custom_theme_app
    ports:
      - "8084:80"
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      # Binds your local folder directly into the container's theme directory.
      - ./my-custom-theme:/var/www/html/wp-content/themes/my-custom-theme
      # Raises PHP upload limits so Media Library accepts files >2M (default)
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

volumes:
  wp_custom_theme_db_data:
name: Deploy Theme (Pantheon + Hostinger)

# Branch → environment → theme (see DEPLOYMENT.md §3):
#   main             → my-custom-theme (classic) → anandiitaa.com           (PROD, live — untouched)
#   gutenberg-rebuild → anandiitaa-block (rebuild) → testing.anandiitaa.com  (STAGING)
# Same 4 HOSTINGER_SFTP_* secrets reach both sites (one SSH account = whole /home/u605618459/);
# only the target path differs. Jobs are gated by branch so a staging push can never touch prod.
on:
  push:
    branches:
      - main
      - gutenberg-rebuild
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # Manual one-offs (gsc-verify below). Deploy jobs stay push-only via
  # event_name guards, so a dispatch can never trigger a theme deploy.
  workflow_dispatch:

jobs:
  # =====================================================================
  # PANTHEON DEPLOY (PROD) — legacy 2-week parallel. main only.
  # Remove this job once Hostinger is fully validated / Pantheon sunset.
  # =====================================================================
  pantheon:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Environment
        run: |
          mkdir -p ~/.ssh
          # Safely write the private key preserving exact newlines
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.PANTHEON_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          # Automatically trust the Pantheon host
          ssh-keyscan -p 2222 -H ${{ secrets.PANTHEON_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy via Native LFTP
        run: |
          # Install lftp on the runner
          sudo apt-get update
          sudo apt-get install lftp -y

          # Execute the mirror command with legacy RSA support
          lftp -c "
          set net:max-retries 1;
          set net:timeout 10;
          set sftp:auto-confirm yes;
          set sftp:connect-program 'ssh -a -x -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa';
          open sftp://${{ secrets.PANTHEON_USERNAME }}:x@${{ secrets.PANTHEON_HOST }}:2222;

          # Explicitly target the remote themes folder
          cd /code/wp-content/themes/my-custom-theme;

          # Locally step into the nested theme folder inside the GitHub runner
          lcd my-custom-theme;

          # Mirror the contents of that inner folder directly to Pantheon
          mirror -R --parallel=5 --exclude-glob .git/ --exclude-glob .github/ --exclude .gitignore --exclude docker-compose.yml ./ ./;
          "

  # =====================================================================
  # HOSTINGER DEPLOY — PROD. classic theme → anandiitaa.com. main only.
  # (Live site. Left exactly as-is per DEPLOYMENT.md — only the branch gate added.)
  # =====================================================================
  hostinger-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy theme via SFTP
        env:
          HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          PASS: ${{ secrets.HOSTINGER_SFTP_PASS }}
        run: |
          lftp -c "
          set net:max-retries 10;
          set net:timeout 30;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-multiplier 1.5;
          set net:reconnect-interval-max 60;
          set sftp:auto-confirm yes;
          open sftp://$USER:$PASS@$HOST:$PORT;

          # Hostinger's anandiitaa.com theme directory.
          # Full path needed — SFTP lands at user home (/home/u605618459/),
          # not filesystem root. The /domains/ leading slash was failing.
          cd /home/u605618459/domains/anandiitaa.com/public_html/wp-content/themes/my-custom-theme;

          # Step into the local theme folder inside the GitHub runner workspace.
          lcd my-custom-theme;

          # Mirror only the theme. Exclude design-refs/source (cruft we kept
          # out of the migration export) and dev files that don't belong in prod.
          mirror -R --parallel=5 \\
            --exclude-glob .git/ \\
            --exclude-glob .github/ \\
            --exclude-glob .DS_Store \\
            --exclude-glob assets/design-refs/ \\
            --exclude-glob assets/images/source/ \\
            --exclude .gitignore \\
            --exclude docker-compose.yml \\
            ./ ./;
          "

  # =====================================================================
  # HOSTINGER DEPLOY — STAGING. block theme → testing.anandiitaa.com.
  # gutenberg-rebuild only. Builds blocks in CI, then SFTP-mirrors the runtime
  # theme. Uses real ssh via sshpass (robust password auth + modern crypto;
  # lftp's built-in SFTP can fail Hostinger's OpenSSH negotiation). Deploys THEME
  # FILES ONLY — page content is migrated separately (DEPLOYMENT.md §5 / CONTENT-MIGRATION.md).
  # =====================================================================
  hostinger-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/gutenberg-rebuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blocks (@wordpress/scripts)
        working-directory: anandiitaa-block
        run: |
          npm ci
          npm run build

      - name: Install lftp + sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp sshpass

      - name: Pre-flight — is the SFTP host reachable from the runner?
        env:
          HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
        run: |
          set +e
          timeout 15 bash -c "exec 3<>/dev/tcp/${HOST}/${PORT}" 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "::error::Cannot open a TCP connection to the SFTP host:port from this runner."
            echo "Likely: wrong HOSTINGER_SFTP_HOST / HOSTINGER_SFTP_PORT secret, OR Hostinger is"
            echo "blocking the GitHub runner IP (firewall / SSH IP-allowlist). Your laptop SSH works"
            echo "because its IP is allowed; the runner's is not."
            exit 1
          fi
          echo "SFTP port reachable from runner ✓ — proceeding to transfer."

      - name: Deploy block theme via SFTP
        env:
          HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SSHPASS: ${{ secrets.HOSTINGER_SFTP_PASS }}
        run: |
          # Feed the SSH password to the real ssh client via sshpass (-e reads $SSHPASS).
          # ssh handles port (-p) + host-key; lftp drives the mirror. This avoids lftp's
          # internal-SFTP crypto limits that produce "max-retries exceeded" on Hostinger.
          lftp -c "
          set sftp:auto-confirm yes;
          set sftp:connect-program 'sshpass -e ssh -a -x -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null';
          set net:max-retries 2;
          set net:timeout 25;
          open sftp://$USER@$HOST;

          # testing.anandiitaa.com is a SUBFOLDER of the main domain (confirmed via SSH).
          cd /home/u605618459/domains/anandiitaa.com/public_html/testing/wp-content/themes/anandiitaa-block;

          # Step into the rebuild theme inside the runner workspace.
          lcd anandiitaa-block;

          # Ship runtime files only — built blocks (build/) ship, source/tooling does not.
          mirror -R --parallel=5 \\
            --exclude-glob .git/ \\
            --exclude-glob .github/ \\
            --exclude-glob .DS_Store \\
            --exclude-glob node_modules/ \\
            --exclude-glob src/ \\
            --exclude-glob package.json \\
            --exclude-glob package-lock.json \\
            --exclude .gitignore \\
            --exclude docker-compose.yml \\
            ./ ./;
          "

  # =====================================================================
  # GSC VERIFY — manual dispatch ONLY (gh workflow run deploy.yml).
  # Uploads the Google Search Console ownership token to the PROD web root
  # (anandiitaa.com/googleb…html). Single inert file — no theme/site impact.
  # This is the sanctioned exception to "staging never touches prod": it is
  # never triggered by a push, and GSC requires the token at the domain root.
  # Keep the file deployed — Google re-checks it periodically.
  # =====================================================================
  gsc-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Pre-flight — is the SFTP host reachable from the runner?
        env:
          HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
        run: |
          set +e
          timeout 15 bash -c "exec 3<>/dev/tcp/${HOST}/${PORT}" 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "::error::Cannot reach SFTP host:port from this runner (IP likely blocked)."
            exit 1
          fi
          echo "SFTP port reachable ✓"

      - name: Upload GSC verification file to prod web root
        env:
          HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SSHPASS: ${{ secrets.HOSTINGER_SFTP_PASS }}
        run: |
          # scp in SFTP mode (OpenSSH 9+ default) — same subsystem the staging
          # deploy already uses successfully via lftp's connect-program.
          sshpass -e scp -P "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            googleb114516a6e061076.html \
            "$USER@$HOST:/home/u605618459/domains/anandiitaa.com/public_html/"

      - name: Verify token is publicly served
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" https://anandiitaa.com/googleb114516a6e061076.html)
          [ "$code" = "200" ] || { echo "::error::Expected 200, got $code"; exit 1; }
          echo "https://anandiitaa.com/googleb114516a6e061076.html → 200 ✓"
